# [FASE 2] TAREFA - Pipeline do GitHub Actions (4 jobs, um por pessoa)
# Branch de cada job: feat/pipeline-<job>
# Commit: feat: adiciona job <job> na pipeline
# Cada pessoa edita SO o seu job. Apague o bloco de TODO do job ao terminar.
#
# O esqueleto so roda manualmente (workflow_dispatch) para nao ficar vermelho.
# Quando os 4 jobs estiverem prontos, trocar o gatilho por push na main e
# pull_request para a main. Secrets do repositorio: POSTGRES_PASSWORD e
# SECRET_KEY (usar como secrets.NOME, nunca escrever o valor).

name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sistema_estoque
          POSTGRES_USER: estoque_app
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estoque_app -d sistema_estoque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Fora do compose o banco e o service acima, acessivel em localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sistema_estoque
      POSTGRES_USER: estoque_app
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar tabelas
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: psql -h localhost -U estoque_app -d sistema_estoque -f backend/db.sql

      # O smoke precisa da aplicacao no ar (so existe no job dast), entao e ignorado aqui
      - name: Rodar testes
        run: python -m pytest --ignore=tests/test_smoke.py -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sistema-estoque .

  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: SAST - Bandit
        run: bandit -r backend -f json -o bandit-report.json
        continue-on-error: true

      - name: Dependency audit - pip-audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn

  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar .env a partir dos secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          {
            echo "POSTGRES_HOST=db"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_DB=sistema_estoque"
            echo "POSTGRES_USER=estoque_app"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "SECRET_KEY=${SECRET_KEY}"
          } > .env

      - name: Subir a aplicacao
        run: docker compose up -d --build --wait

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Smoke com a aplicacao no ar, antes do ZAP
      - name: Smoke tests
        run: python -m pytest tests/test_smoke.py -v

      - name: DAST - OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Derrubar a aplicacao
        if: always()
        run: docker compose down -v
